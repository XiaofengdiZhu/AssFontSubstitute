[project]
name = "ass-font-substitute"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "销锋镝铸", email = "523084467@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.53",
    "freetype-py>=2.4",
    "numpy>=2.0",
    "light-ass>=0.3",
    "opencc>=1.1",
    "xxhash>=3.0",
    "pyside6>=6.7",
    "pyside6-fluent-widgets>=1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# 默认规则集（pyflakes F + 少量 pycodestyle E）：F821 未定义名
# （误删 import 一类）、F401 未用 import、F841 未用变量等硬错优先
select = ["E4", "E7", "E9", "F"]
