[project]
name = "ass-font-substitute"
version = "1.0.0"
description = "用于解决 ASS 字幕文件经简繁转换后，原字体覆盖率不足/难以找到相似替补字体的问题的一站式 GUI 工具"
readme = "README.md"
authors = [
    { name = "销锋镝铸", email = "523084467@qq.com" }
]
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
dependencies = [
    "fonttools>=4.53",
    "freetype-py>=2.4",
    "numpy>=2.0",
    "light-ass>=0.3",
    "opencc>=1.1",
    "pyside6>=6.7",
    "pyside6-fluent-widgets>=1.8",
    "darkdetect>=0.8.0",
    "shiboken6>=6.12.0",
    "pysidesix-frameless-window>=0.8.2",
]

[project.urls]
Homepage = "https://github.com/XiaofengdiZhu/AssFontSubstitute"
Repository = "https://github.com/XiaofengdiZhu/AssFontSubstitute"
Issues = "https://github.com/XiaofengdiZhu/AssFontSubstitute/issues"

[dependency-groups]
dev = [
    "nuitka>=4.3.3",
    "py7zr>=1.1.4",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://uv.agentsmirror.com/pypi/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# 硬错 + 高性价比风格：pyflakes(F)、pycodestyle 错误级(E4/E7/E9)、
# import 排序(I)、pyupgrade(UP)、bugbear(B)、comprehensions(C4)、
# 简化(SIM)、ruff 自有(RUF)。行宽与引号不锁（E501 不启用）。
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "RUF001", # 字符串含全角标点（中文 UI 文案本体）
    "RUF002", # 注释同上
    "RUF003", # docstring 同上
]

[tool.ruff.lint.per-file-ignores]
# 测试允许 pytest.raises(Exception) 宽断言
"tests/**" = ["B017"]

[tool.ruff.lint.isort]
force-single-line = true   # 一行一 import，diff 干净
